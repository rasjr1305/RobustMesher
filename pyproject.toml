[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robustmesher"
version = "0.1.0"
description = "Standalone 2D/3D seismic mesh generation and Winslow adaptation with Gmsh."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LGPL-3.0-or-later"}
authors = [{name = "Romildo Junior"}]
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7,<4",
    "segyio>=1.9.12,<2",
    "gmsh>=4.15.2,<5",
    "meshio>=5.3,<6",
    "numba>=0.59,<1",
    "h5py>=3.9,<4",
]

[project.optional-dependencies]
examples = ["notebook", "ipykernel"]
dev = ["pytest>=8", "build>=1"]

[project.urls]
Homepage = "https://github.com/rasjr1305/RobustMesher"
Repository = "https://github.com/rasjr1305/RobustMesher"

[tool.setuptools.packages.find]
where = ["."]
include = ["RobustMesher*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
RobustMesher = ["velocity_models/*.segy", "velocity_models/*.bin", "velocity_models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
